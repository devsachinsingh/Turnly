services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: turnly
      POSTGRES_PASSWORD: turnly
      POSTGRES_DB: turnly
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI

volumes:
  postgres_data:
